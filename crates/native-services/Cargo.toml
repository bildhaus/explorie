[package]
name = "explorie-native-services"
version = "0.1.0"
edition = "2024"
authors = ["explorie contributors"]
description = "Native services for the explorie desktop application."
license = "MIT"
repository = "https://github.com/bildhaus/explorie"

[features]
# Optional preview backends. Every one is on by default, so release builds and
# plain `cargo build`/`cargo test` keep the full preview set; turn them off
# (`--no-default-features`) for faster local builds that need no CMake. A
# missing backend reports an Unsupported error instead of a preview.
default = ["preview-3d", "preview-audio", "preview-columnar", "preview-fonts", "preview-mail", "preview-sqlite"]
# 3D model previews and thumbnails (glTF, OBJ, STL, PLY, 3MF, FBX) through
# assimp, compiled from C++ source with CMake and run in a helper process.
preview-3d = ["dep:asset-importer"]
# Native audio playback, including video soundtracks (rodio + symphonia).
preview-audio = ["dep:rodio"]
# Apache Parquet and Arrow IPC/Feather table previews.
preview-columnar = ["dep:arrow-array", "dep:arrow-cast", "dep:arrow-ipc", "dep:parquet"]
# Font specimen previews (TTF, OTF, WOFF, WOFF2).
preview-fonts = ["dep:fontdue", "dep:wuff"]
# Email message (.eml) previews.
preview-mail = ["dep:mail-parser"]
# SQLite database previews (bundled SQLite, compiled from C source).
preview-sqlite = ["dep:rusqlite"]

[dependencies]
arrow-array = { version = "59.2.0", optional = true }
arrow-cast = { version = "59.2.0", optional = true }
arrow-ipc = { version = "59.2.0", features = ["lz4", "zstd"], optional = true }
asset-importer = { version = "0.8.0", features = ["static-link"], optional = true }
dirs = "6.0.0"
explorie-core = { path = "../core" }
explorie-plugin-protocol = { path = "../plugin-protocol" }
fontdue = { version = "0.9.4", optional = true }
html2text = "0.17.1"
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
hayro-syntax = "=0.7.2"
karet-pdf = "=0.5.0"
mail-parser = { version = "0.11.8", optional = true }
minisign-verify = "0.3"
notify = "8.2.0"
open = "5"
parquet = { version = "59.2.0", default-features = false, features = ["brotli", "flate2-zlib-rs", "lz4", "snap", "zstd"], optional = true }
png = "0.18.0"
psd = "0.3.5"
pulldown-cmark = "0.13.4"
regex = "1.11"
resvg = "=0.45.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "symphonia-aiff", "symphonia-alac", "symphonia-caf", "vorbis", "wav"], optional = true }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks", "limits"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
sysinfo = "0.30.5"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
uuid = { version = "1.8", features = ["v4"] }
wuff = { version = "0.2.8", optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
pollster = "0.2.5"
tempfile = "3.9"

[target.'cfg(target_os = "macos")'.dev-dependencies]
plist = { version = "1.10.1", default-features = false }
