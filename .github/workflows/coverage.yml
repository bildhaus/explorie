name: Coverage

# Coverage informs; it gates neither merges nor releases. It runs in its own
# workflow so CI (which releases require to pass on main) finishes without
# waiting for this slow instrumented build, and a coverage-tool failure
# cannot block a release.

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Rust Coverage
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './ -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@419f0f955ea0cf384c06ae25b10b8d3bcba087da # cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@aa7e9e10a2fd43c88f1948b7de4af2f4efd56483
        with:
          tool: cargo-nextest

      - name: Prepare native dependencies
        run: |
          node scripts/prepare-rclone.mjs
          node scripts/prepare-winfsp.mjs
          node scripts/prepare-7zip.mjs

      - name: Generate native Rust coverage
        timeout-minutes: 30
        env:
          NEXTEST_PROFILE: ci
        run: >-
          cargo llvm-cov nextest --locked --all-features --lcov --output-path lcov.info
          -p explorie-core -p explorie-native-services -p explorie-ffmpeg-wrapper -p explorie-cli
          -E 'not test(=preview::tests::windows_shell_icons_cover_regular_files_and_folders_and_reuse_cache)'

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 30

      - name: Coverage summary
        shell: bash
        run: |
          echo "## Rust Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f lcov.info ]; then
            cargo llvm-cov report --summary-only 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi
