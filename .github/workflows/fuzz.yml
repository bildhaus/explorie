name: Fuzz

on:
  schedule:
    # Weekly, off-peak: a bounded run per target, resuming the saved corpus.
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        type: number
        required: false
        default: 600

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [sevenzip_listing, archive_entry_path, explorie_metadata, plugin_frames]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        # The allow-listed install-action commit has no cargo-fuzz manifest.
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || 600 }}
        run: |
          set -euo pipefail
          # Fuzz the exact dependency versions the application ships.
          cp Cargo.lock fuzz/Cargo.lock
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096 -timeout=10

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
