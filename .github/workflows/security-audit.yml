name: Scheduled Security Audit

on:
  schedule:
    # Weekly, so advisories published against an unchanged main still surface.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-advisories:
    name: Rust Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@aa7e9e10a2fd43c88f1948b7de4af2f4efd56483 # cargo-audit

      - name: Install cargo-deny
        # The repository only allows specific action SHAs; reuse the allow-listed
        # install-action commit and pick the tool through its input.
        uses: taiki-e/install-action@aa7e9e10a2fd43c88f1948b7de4af2f4efd56483
        with:
          tool: cargo-deny

      - name: Run cargo audit
        run: |
          set -o pipefail
          echo "## cargo audit" >> "$GITHUB_STEP_SUMMARY"
          cargo audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run cargo deny advisories policy
        # Report both tools even when cargo audit already failed.
        if: ${{ !cancelled() }}
        run: cargo deny --locked check advisories
