name: Validate macOS UI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-macos-ui:
    name: CoreText and Metal rendering
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './ -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify CoreText glyphs reach the Metal renderer
        env:
          EXPLORIE_RENDER_PROBE_OUTPUT: target/macos-render-probe.png
        run: cargo run --locked -p explorie-gpui --example macos_render_probe

      - name: Upload macOS rendering proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-render-probe
          path: target/macos-render-probe.png
          if-no-files-found: warn
