version: 2

# GitHub Actions are not updated here: the repository's Actions allow-list
# names each action by its exact commit, so a bumped action cannot start until
# the allow-list is updated with it. Bump actions by hand, together with the
# allow-list.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # parquet and the arrow crates share types, so a bump of one alone
      # leaves two arrow versions in the build. Listed first so their minor
      # bumps land here too.
      arrow:
        patterns:
          - arrow-*
          - parquet
      # One reviewable PR per week for semver-compatible bumps; major bumps
      # still arrive as individual PRs.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # GPUI is pinned to one zed-industries/zed git revision. Bump all three
      # crates together by hand and re-verify both desktop platforms.
      - dependency-name: gpui
      - dependency-name: gpui_platform
      - dependency-name: gpui_windows
      # Pinned to the version GPUI's macOS backend uses; bump it with GPUI.
      - dependency-name: cocoa
