[package]
name = "explorie-plugin-syncthing"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
explorie-plugin-protocol = { path = "../../crates/plugin-protocol" }
serde_json = "1"
url = "2"
# `~` because the pinned-certificate TLS connector uses `ureq::unversioned`,
# which ureq may change in minor releases.
ureq = { version = "~3.5", default-features = false, features = ["rustls"] }
roxmltree = "0.20"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dirs = "7"

[dev-dependencies]
tempfile = "3"
